<!doctype html>
<html lang="es">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquitectura Celular · Explora la arquitectura de la vida</title>
<meta name="description" content="Explora cinco tipos de células como modelos 3D detallados que giran">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe6;--ink:#211c1a;--ink2:#5d5651;--mute:#9a918a;--line:rgba(70,50,30,.10);
  --glass:rgba(255,252,248,.62);--glass2:rgba(255,252,248,.82);
  --accent:#e07a93;--accent-soft:#fbe4ea;
  --serif:"Inter Tight",system-ui,sans-serif;--sans:"Inter Tight",system-ui,sans-serif;
}
h1,.brand,.kv dd,.fn b,.know{letter-spacing:-.02em}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(900px 620px at 52% 46%,#fff6ec 0,transparent 70%),radial-gradient(700px 500px at 85% 10%,#f9e6e4,transparent 70%),radial-gradient(800px 600px at 10% 90%,#f3e7da,transparent 70%),var(--bg)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 50px -28px rgba(90,60,30,.35),inset 0 1px 0 rgba(255,255,255,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

/* bubbles: soft background decoration */
.bub{position:fixed;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(255,226,214,.35) 55%,rgba(255,210,200,.08));box-shadow:inset -2px -3px 6px rgba(220,160,140,.25);animation:float 14s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}

header{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:22px 44px}
.brand{display:flex;align-items:center;gap:12px;font:600 21px var(--serif)}
.brand i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f3b7c4 40%,#7b6ad6 75%,#3a4fa8);box-shadow:0 4px 10px rgba(120,90,180,.3)}
nav{display:flex;gap:40px}
nav a{position:relative;color:var(--ink2);text-decoration:none;font-size:16px;font-weight:500;padding:6px 0}
nav a[aria-current=page]{color:var(--ink)}
nav a[aria-current=page]:after{content:"";position:absolute;left:30%;right:30%;bottom:-6px;height:1px;background:var(--ink)}
.search{justify-self:end;position:relative;width:250px}
.search input{width:100%;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--glass2);padding:0 16px 0 42px;font-size:15px;outline:none}
.search svg{position:absolute;left:16px;top:14px;width:16px;height:16px}
.results{position:absolute;right:0;top:44px;width:300px;max-height:320px;overflow:auto;border-radius:16px;padding:6px;display:none}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:500}
.results button:hover,.results button:focus-visible{background:rgba(0,0,0,.04)}
.results small{display:block;color:var(--ink2);font-size:13px;font-weight:400}

.app{position:relative;z-index:1;display:grid;grid-template-columns:262px minmax(0,1fr) 376px;gap:28px;padding:6px 44px 28px;min-height:calc(100svh - 82px)}

/* left cards */
.side{display:flex;flex-direction:column;gap:14px}
.card{display:grid;grid-template-columns:72px 1fr 16px;gap:16px;align-items:center;padding:14px;border-radius:22px;text-align:left;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-1px)}
.card img{width:72px;height:84px;border-radius:14px;object-fit:cover;background:#efe6dc;display:block}
.card b{display:block;font-weight:600;font-size:18px;letter-spacing:-.01em}
.card small{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.card svg{width:14px;height:14px;color:var(--ink2)}
.card[aria-pressed=true]{border-color:color-mix(in srgb,var(--accent) 70%,#fff);box-shadow:0 18px 50px -28px rgba(90,60,30,.35),0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent)}
.count{color:var(--ink2);font-size:15px;margin:6px 0 0 14px}
.tagline{margin-top:auto;font:600 22px/1.2 var(--sans);letter-spacing:-.02em;color:var(--ink)}

/* stage */
.stage{position:relative;min-height:620px}
#gl{position:absolute;inset:-20px -10px 70px;touch-action:pan-y}
#gl canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y}
.call{position:absolute;z-index:2;left:0;top:0;font-size:16px;font-weight:600;white-space:nowrap;pointer-events:auto;transition:opacity .3s;padding:6px 12px;border-radius:99px;background:rgba(255,252,248,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.call i{display:none}
.call.off{opacity:0;pointer-events:none}
.lead{position:absolute;z-index:1;left:0;top:0;height:1px;background:rgba(70,50,40,.38);transform-origin:0 50%;pointer-events:none;transition:opacity .3s}
.dot{position:absolute;z-index:1;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(70,50,40,.55);pointer-events:none;transition:opacity .3s}
.lead.off,.dot.off{opacity:0}
.loading{position:absolute;z-index:2;left:50%;top:44%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:10px;color:var(--ink2);pointer-events:none}
.loading[hidden]{display:none}
.loading i{display:block;width:180px;height:3px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden}
.loading em{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.loading small{font-size:14px;color:var(--ink2)}

.bar{position:absolute;z-index:3;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:8px;border-radius:99px}
.bar>*{height:48px;border-radius:99px;background:var(--glass2);border:1px solid rgba(255,255,255,.8);display:flex;align-items:center}
.bar .ic{width:48px;justify-content:center}
.bar .ic svg{width:18px;height:18px}
.zoom{gap:12px;padding:0 16px}
.zoom button{width:20px;height:20px;font-size:18px;line-height:1;display:grid;place-items:center}
.zoom input{width:110px;accent-color:var(--ink);-webkit-appearance:none;appearance:none;height:1px;background:rgba(60,40,30,.25)}
.zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink2);border:0}
.zoom input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink2);border:0}
.mode{padding:4px;gap:2px}
.mode button{height:38px;padding:0 20px;border-radius:99px;font-weight:600;font-size:15px;color:var(--ink2)}
.mode button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(90,60,30,.4)}

/* right panel */
.panel{border-radius:28px;padding:28px 26px 18px;display:flex;flex-direction:column;max-height:calc(100svh - 110px);position:sticky;top:20px}
.kick{display:flex;justify-content:space-between;font-size:15px;font-weight:500;color:var(--ink2)}
.panel h1{font:600 clamp(46px,4vw,60px)/1 var(--serif);letter-spacing:-.035em;margin:14px 0 14px}
.lede{font-size:18px;line-height:1.5;color:var(--ink2);margin:0 0 20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.kv dt{font-size:14px;color:var(--ink2)}
.kv dd{margin:2px 0 0;font:600 20px/1.25 var(--serif)}
.kv div.wide{grid-column:1/-1}
.kv div.wide dd{font-size:17px;font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:99px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);margin-bottom:12px}
.tabs button{height:42px;border-radius:99px;font-size:15px;font-weight:500;color:var(--ink2)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 4px 12px -6px rgba(90,60,30,.35)}
.pane{overflow-y:auto;min-height:0;flex:1;margin:0 -8px;padding:0 8px 6px;scrollbar-width:thin}
.pane[hidden]{display:none}
.st{border-radius:18px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);margin-bottom:10px}
.st>button{display:grid;grid-template-columns:76px 1fr 20px;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 14px 10px 10px}
.st img,.st .ph{width:76px;height:70px;border-radius:12px;object-fit:cover;display:block}
.st .ph{background:radial-gradient(circle at 40% 40%,#fff,var(--accent-soft) 60%,color-mix(in srgb,var(--accent) 40%,#fff))}
.st b{display:block;font-weight:600;font-size:17px;letter-spacing:-.01em}
.st span{display:block;font-size:14px;color:var(--ink2);line-height:1.45;margin-top:2px}
.st .pm{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font-size:15px;font-style:normal;line-height:1;color:var(--ink2)}
.st .more{display:none;padding:0 16px 14px 100px;font-size:15px;color:var(--ink2)}
.st .more a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--accent);cursor:pointer}
.st.open .more{display:block}
.fn{padding:12px 4px;border-bottom:1px solid var(--line)}
.fn b{display:block;font:600 20px/1.2 var(--serif)}
.fn span{color:var(--ink2);font-size:15px}
.know{font:600 24px/1.25 var(--serif);margin:6px 4px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 14px}
.chips span{font-size:14px;font-weight:600;border-radius:99px;padding:7px 13px;background:var(--accent-soft)}
.note{font-size:14px;color:var(--ink2);margin:8px 4px 0}

@media (max-width:1200px){
  header{padding:18px 24px}
  nav{gap:24px}
  .search{width:200px}
  .app{grid-template-columns:220px minmax(0,1fr);padding:6px 24px 24px}
  .panel{grid-column:1/-1;position:static;max-height:none}
  .pane{overflow:visible}
}
@media (max-width:820px){
  header{grid-template-columns:1fr auto;padding:14px 16px}
  nav{display:none}
  .brand{font-size:18px;gap:10px}
  .search{width:150px}
  .results{width:min(300px,calc(100vw - 32px))}
  .app{grid-template-columns:minmax(0,1fr);padding:0 16px 20px;gap:16px}
  .side{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;gap:10px}
  .card{flex:0 0 220px;grid-template-columns:56px 1fr 12px;scroll-snap-align:start;padding:10px}
  .card img{width:56px;height:62px}
  .count,.tagline{display:none}
  .stage{min-height:0;height:min(76svh,560px)}
  #gl{inset:0 -16px 72px}
  .call{font-size:14px;padding:5px 10px}
  .bar{gap:6px;padding:6px;max-width:calc(100vw - 24px)}
  .bar>*{height:42px}
  .bar .ic{width:42px}
  .zoom{padding:0 10px;gap:8px}
  .zoom input{width:64px}
  .mode button{padding:0 12px;height:34px}
  .panel{padding:22px 18px 14px;border-radius:22px}
  .st>button{grid-template-columns:60px 1fr 20px}
  .st img,.st .ph{width:60px;height:56px}
  .st .more{padding-left:16px}
}
</style>
</head>
<body>
<span class="bub" style="width:26px;height:26px;left:37%;top:9%"></span>
<span class="bub" style="width:18px;height:18px;left:58%;top:16%;animation-delay:-4s"></span>
<span class="bub" style="width:30px;height:30px;left:28%;top:56%;animation-delay:-7s"></span>
<span class="bub" style="width:20px;height:20px;left:62%;top:80%;animation-delay:-2s"></span>
<span class="bub" style="width:14px;height:14px;left:47%;top:84%;animation-delay:-9s"></span>

<header>
  <div class="brand"><i aria-hidden="true"></i>Arquitectura Celular</div>
  <nav aria-label="Principal">
    <a href="#top" aria-current="page">Explorar</a><a href="#types">Tipos de células</a><a href="#panel" data-tab="details">Detalles</a><a href="#panel" data-tab="functions">Funciones</a>
  </nav>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar estructuras, funciones…" aria-label="Buscar estructuras y funciones" autocomplete="off">
    <div class="results glass" id="results" role="listbox"></div>
  </div>
</header>

<main class="app" id="top">
  <aside class="side" id="types" aria-label="Tipos de células">
    <div id="list" style="display:contents"></div>
    <p class="count">5 tipos de células</p>
    <p class="tagline">Explora la<br>arquitectura de la vida</p>
  </aside>

  <section class="stage" aria-label="Modelo 3D">
    <div id="gl"></div>
    <div id="calls"></div>
    <div class="loading" id="loading"><span>Cargando <b id="loadName">Célula animal</b></span><i><em id="barFill"></em></i><small id="pct">0%</small></div>
    <div class="bar glass" role="toolbar" aria-label="Controles de vista">
      <button class="ic" id="recenter" aria-label="Recentrar vista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      <div class="zoom"><button id="zout" aria-label="Alejar">−</button><input id="zr" type="range" min="0" max="100" value="30" aria-label="Zoom"><button id="zin" aria-label="Acercar">+</button></div>
      <div class="mode" role="group" aria-label="Modo de vista"><button id="m3" aria-pressed="true">3D</button><button id="m2" aria-pressed="false">2D</button></div>
      <button class="ic" id="fs" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </section>

  <aside class="panel glass" id="panel" aria-live="polite">
    <div class="kick"><span id="kName">Célula animal</span><span id="kNum">01 / 05</span></div>
    <h1 id="title">Célula animal</h1>
    <p class="lede" id="lede"></p>
    <dl class="kv" id="kv"></dl>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-structures" aria-selected="true" aria-controls="p-structures">Estructuras</button>
      <button role="tab" id="t-functions" aria-selected="false" aria-controls="p-functions">Funciones</button>
      <button role="tab" id="t-details" aria-selected="false" aria-controls="p-details">Detalles</button>
    </div>
    <div class="pane" id="p-structures" role="tabpanel"></div>
    <div class="pane" id="p-functions" role="tabpanel" hidden></div>
    <div class="pane" id="p-details" role="tabpanel" hidden></div>
  </aside>
</main>

<script type="importmap">

  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

}}
</script>
<script src="zenban-plugin-sdk.js"></script>
<script type="module" src="app.js"></script>
